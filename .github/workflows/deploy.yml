name: Deploy to Azure App Service

# Deploy on every push to master (and allow manual runs).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: fungkao
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `dotnet publish` also builds the Vite SPA into wwwroot via the MSBuild
      # targets in backend/Blog.Api.csproj (runs `npm install` + `npm run build`).
      - name: Publish (builds SPA + .NET)
        run: dotnet publish backend/Blog.Api.csproj -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ env.PUBLISH_DIR }}
